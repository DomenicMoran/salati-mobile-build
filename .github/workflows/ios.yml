name: iOS Release IPA

# Baut die signierte App-Store-IPA auf einem KOSTENLOSEN macOS-Runner
# (öffentliches Repo = unbegrenzte Minuten, auch macOS). Ersetzt den kosten-
# pflichtigen EAS-iOS-Build. Signing kommt ausschließlich aus verschlüsselten
# Actions-Secrets (Dist-Zertifikat .p12 + 4 Provisioning-Profile). 4 Targets:
# App (de.salatibox.de), Widget (.widget), Watch (.watch), Watch-Komplikation
# (.watch.clock). Manuell ausgelöst (workflow_dispatch), da macOS-Runs länger
# dauern und nicht bei jedem Push nötig sind.

on:
  workflow_dispatch:

env:
  TEAM_ID: ZKG548NGDR

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm installieren
        run: npm install -g pnpm@10.33.0

      - name: pnpm install (wendet whisper.rn-Patch an)
        run: pnpm install --no-frozen-lockfile

      # Zwei Anpassungen an Expo-Modulen fuer Swift 6.2. Sie stehen als Skript
      # da, weil der Uhren-Pruefworkflow dieselbe Pod-Kette baut und sie
      # ebenfalls braucht — zweimal derselbe Perl-Einzeiler in zwei Workflows
      # laeuft zwangslaeufig auseinander. Begruendung je Regel im Skript.
      - name: Swift-6.2-Anpassungen an den Expo-Modulen
        run: bash scripts/expo-swift62-fix.sh

      # NICHT mehr mit `|| echo` abfangen. Genau das hat den Fehler verdeckt:
      # das Skript stieg still aus (EAS-Variable fehlt auf diesem Runner), der
      # Schritt blieb gruen, und Apple lehnte die fertige Einreichung mit
      # ITMS-90512 als "Ungueltige Binaerdatei" ab. Ein Fix, der schweigend
      # nichts tut, ist schlimmer als keiner.
      - name: whisper.rn iOS-SDK-Fix (vtool)
        run: bash scripts/fix-whisper-rn-ios-sdk.sh

      # Nachweisen, dass der Patch wirklich sitzt — vor dem Bauen, nicht erst
      # aus Apples Ablehnungsmail. `vtool -show` nennt die SDK-Version des
      # Mach-O; sie muss unter Apples Maximum liegen.
      - name: Nachweis — SDK-Version des whisper-Frameworks
        run: |
          BIN=node_modules/whisper.rn/ios/rnwhisper.xcframework/ios-arm64/rnwhisper.framework/rnwhisper
          test -f "$BIN"
          SDK=$(vtool -show "$BIN" | awk '/sdk/ {print $2; exit}')
          echo "rnwhisper meldet sdk=$SDK"
          case "$SDK" in
            27.*|28.*|29.*) echo "::error::sdk=$SDK liegt ueber Apples Maximum — der vtool-Patch hat nicht gegriffen."; exit 1 ;;
          esac

      # Xcode 26: Expo SDK 57s SPM-Pakete (expo-modules-jsi etc.) deklarieren
      # swift-tools 6.2 und brauchen daher Xcode 26 zum Auflösen. Der Swift-6.2-
      # Compilefehler in expo-modules-jsi (`weak let`) wird separat gepatcht.
      - name: Xcode-Version wählen (26 — Expo SDK 57 SPM-Tools 6.2)
        run: |
          # Hoechste vorhandene 26er-Version, nicht die erste: der Runner hat
          # mehrere parallel, und ihre Plattformen sind unterschiedlich
          # vollstaendig. Xcode 26.0.1 bringt watchOS 26.0 mit, das auf dem
          # Abbild NICHT installiert ist — der Uhren-Build brach genau daran ab
          # ("watchOS 26.0 is not installed"), waehrend watchOS 26.1 und 26.2
          # daneben bereitstanden.
          echo "--- vorhandene Xcode-Versionen ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # NICHT einfach das neueste: Xcode 26.3 verschaerft die Swift-C++-
          # Pruefung und weist expo-modules-jsi ab
          # ("'RuntimeScheduler' cannot be annotated with either
          #  SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_UNRETAINED because it is
          #  not returning a SWIFT_SHARED_REFERENCE type", Lauf 32864278770 am
          # 2026-08-25). Bis Expo das nachzieht, das neueste Xcode 26 UNTER
          # 26.3 nehmen; gibt es keins, lieber das neueste als gar keins.
          # Nachtrag 2026-08-25: mit Xcode 26.2 kommt DERSELBE Fehler wie mit
          # 26.3 - die Verschaerfung steckt also schon in 26.2. Deshalb das
          # neueste Xcode 26 aus der Liste der bekannt vertraeglichen Staende
          # (26.0/26.1); erst wenn Expo expo-modules-jsi nachzieht, darf das
          # hier wieder auf "das neueste" gehen.
          XCODE=""
          for v in 26.1 26.0; do
            [ -d "/Applications/Xcode_$v.app" ] && XCODE="/Applications/Xcode_$v.app" && break
          done
          test -n "$XCODE" || XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "FEHLER: kein Xcode 26 auf dem Runner"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "--- installierte watchOS-Plattformen ---"
          xcrun simctl list runtimes | grep -i watch || echo "KEINE watchOS-Laufzeit"

      # Die Uhren-Targets sind seit 1.50.0 wieder dabei. Frueher standen sie
      # hier auf der Ausschlussliste, weil ihr Asset-Compile eine watchOS-
      # Laufzeit verlangt, die der Runner angeblich nicht hatte. Nachgemessen
      # (Lauf 31912082356) bringt macos-15 watchOS 11.5, 26.1 und 26.2 mit —
      # es fehlte nur die Laufzeit der ZUFAELLIG gewaehlten Xcode-Punktversion.
      # Genau das loest der Schritt darueber.
      - name: expo prebuild (iOS-Projekt generieren)
        run: npx expo prebuild -p ios --no-install

      - name: CocoaPods installieren
        working-directory: ios
        run: pod install --repo-update

      - name: Signing einrichten (Keychain + Zertifikat + Profile)
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          PROF_MAIN: ${{ secrets.IOS_PROFILE_MAIN }}
          PROF_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET }}
          PROF_WATCH: ${{ secrets.IOS_PROFILE_WATCH }}
          PROF_COMPLICATION: ${{ secrets.IOS_PROFILE_COMPLICATION }}
        run: |
          set -e
          KC="$RUNNER_TEMP/salati.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          # Zertifikat importieren
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
          # Keychain in die Suchliste
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KC"
          # Provisioning-Profile installieren (Xcode matcht per Bundle-ID)
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          i=0
          for P in "$PROF_MAIN" "$PROF_WIDGET" "$PROF_WATCH" "$PROF_COMPLICATION"; do
            echo "$P" | base64 -d > "$PROF_DIR/salati_$i.mobileprovision"
            i=$((i+1))
          done
          ls -la "$PROF_DIR"

      - name: exportOptions.plist schreiben
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>ZKG548NGDR</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.salatibox.de</key><string>Salati AppStore v3 2026-07-19</string>
              <key>de.salatibox.de.widget</key><string>Salati Widget AppStore v2 2026-07-19</string>
              <key>de.salatibox.de.watch</key><string>Salati Watch AppStore 2026-07-28-ag</string>
              <key>de.salatibox.de.watch.clock</key><string>Salati Watch Clock AppStore v2 2026-07-19</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: ASC-API-Key ablegen (für Auto-Provisioning)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc.p8"

      # Archive UNSIGNIERT bauen (nur kompilieren) — die Distribution-Signierung
      # macht der Export-Schritt via exportOptions (App-Store-Profile). Das
      # umgeht Xcodes Auto-Signing-Default auf Development-Profile (die
      # registrierte Geraete braeuchten).
      - name: Archiv bauen (xcodebuild archive, unsigniert)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Salati.xcworkspace \
            -scheme Salati \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Salati.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=ZKG548NGDR \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      - name: IPA exportieren
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Salati.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      # Beleg statt Vertrauen: die Uhren-App ist erst dann ausgeliefert, wenn sie
      # als eigenes Bundle IN der IPA steckt. Bis 1.49.1 loeschte dieser
      # Workflow die Watch-Targets vor dem Prebuild — der Build war gruen und
      # die Uhr trotzdem nicht dabei. Der Schritt bricht ab, wenn eines der
      # beiden Bundles fehlt, damit das nicht noch einmal unbemerkt passiert.
      - name: Uhren-App in der IPA nachweisen
        run: |
          set -e
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          rm -rf "$RUNNER_TEMP/ipa-pruefung" && mkdir -p "$RUNNER_TEMP/ipa-pruefung"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-pruefung"
          echo "--- Bundles in der IPA ---"
          find "$RUNNER_TEMP/ipa-pruefung/Payload" -name "Info.plist" -path "*.app/*" -o -name "Info.plist" -path "*.appex/*" | while read -r f; do
            id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$f" 2>/dev/null || true)
            [ -n "$id" ] && echo "  $id"
          done
          WATCH_DIR="$(find "$RUNNER_TEMP/ipa-pruefung/Payload" -type d -name "*.app" -path "*Watch*" | head -1)"
          test -n "$WATCH_DIR" || { echo "FEHLER: keine watchOS-App in der IPA"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH_DIR/Info.plist"
          test -n "$(find "$WATCH_DIR" -name "*.appex" -type d | head -1)" || { echo "FEHLER: keine Komplikation in der Uhren-App"; exit 1; }
          echo "Uhren-App und Komplikation sind in der IPA."

      # Direkt zu App Store Connect — OHNE Umweg über den Artefakt-Speicher.
      #
      # WARUM: Am 2026-08-07 war der Build zweimal vollständig fertig (Archiv
      # gebaut, IPA exportiert) und scheiterte erst am Hochladen des Artefakts:
      # "Artifact storage quota has been hit". Das Kontingent gilt kontoweit und
      # wird laut GitHub nur alle 6–12 Stunden neu berechnet — Löschen half
      # sofort nicht. Die IPA lag also fertig auf dem Runner und war trotzdem
      # nicht zu gebrauchen.
      #
      # Der Umweg war ohnehin einer: die IPA muss zu Apple, nicht in einen
      # Zwischenspeicher. `xcrun altool` lädt sie direkt hoch und nutzt dafür
      # denselben ASC-API-Schlüssel, der schon für das Provisioning hier liegt.
      # Danach taucht sie in App Store Connect als neuer Build auf.
      - name: IPA direkt zu App Store Connect laden
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "Lade hoch: $IPA ($(du -h "$IPA" | cut -f1))"
          # altool sucht den Schlüssel in einem festen Pfad, nicht per Argument.
          mkdir -p "$HOME/private_keys"
          cp "$RUNNER_TEMP/asc.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Hochgeladen. Apple verarbeitet den Build; er erscheint danach in ASC."

      # Zusätzlich als Artefakt — nur als Rückfallebene zum Herunterladen.
      # Schlägt der Upload am Kontingent fehl, ist das kein Grund, den ganzen
      # Lauf rot zu färben: die IPA ist zu diesem Zeitpunkt bereits bei Apple.
      - name: IPA als Artefakt hochladen (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: salati-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 5
