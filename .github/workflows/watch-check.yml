name: Watch-App im Simulator pruefen

# Baut die watchOS-App fuer den Simulator, startet sie mit echten Daten und
# legt von jeder der drei Seiten ein Bild ab.
#
# WARUM ES DAS GIBT: die Uhren-App lag seit 1.33 im Repo, wurde aber nie
# ausgeliefert — der iOS-Workflow loeschte die Watch-Targets vor dem Prebuild.
# Sie ist damit auch nie gelaufen. Bevor sie in den Laden geht, muss jede Seite
# einmal wirklich auf einem Bildschirm gestanden haben.
#
# Die Bilder landen in R2 (nicht im Artefakt-Speicher: das Kontingent ist
# kontoweit dauerhaft am Anschlag, siehe scripts/ci-release-upload.mjs).

on:
  workflow_dispatch:
    inputs:
      geraet:
        description: 'Simulator-Modell (leer = erstes verfuegbares watchOS-Geraet)'
        required: false
        default: ''

jobs:
  watch-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm installieren
        run: npm install -g pnpm@10.33.0

      - name: pnpm install
        run: pnpm install --no-frozen-lockfile

      # Gleiche Kaskade wie im iOS-Workflow: die genaue Punktversion wechselt
      # mit dem Runner-Abbild, ein fester Pfad ist eine Sollbruchstelle.
      - name: Xcode 26 waehlen
        run: |
          # Hoechste vorhandene 26er-Version, nicht die erste: der Runner hat
          # mehrere parallel, und ihre Plattformen sind unterschiedlich
          # vollstaendig. Xcode 26.0.1 bringt watchOS 26.0 mit, das auf dem
          # Abbild NICHT installiert ist — der Uhren-Build brach genau daran ab
          # ("watchOS 26.0 is not installed"), waehrend watchOS 26.1 und 26.2
          # daneben bereitstanden.
          echo "--- vorhandene Xcode-Versionen ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "FEHLER: kein Xcode 26 auf dem Runner"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "--- installierte watchOS-Plattformen ---"
          xcrun simctl list runtimes | grep -i watch || echo "KEINE watchOS-Laufzeit"

      # Ohne watchOS-Laufzeit gibt es weder Simulator noch Asset-Compile fuer
      # die Uhr — genau daran scheiterte frueher der iOS-Build. Deshalb steht
      # die Pruefung ganz vorn und nicht als Fehlschlag 20 Minuten spaeter.
      - name: watchOS-Laufzeiten und -Geraete auflisten
        run: |
          echo "--- Laufzeiten ---"
          xcrun simctl list runtimes | grep -i watch || echo "KEINE watchOS-Laufzeit"
          echo "--- Geraete ---"
          xcrun simctl list devices available | grep -i -A 12 "watchos" || true

      # Der Uhren-Build haengt am iOS-Host-Target und zieht damit die ganze
      # Pod-Kette mit — inklusive der Expo-Module, die ohne diese Anpassungen
      # unter Swift 6.2 nicht uebersetzen (Lauf 31929279067).
      - name: Swift-6.2-Anpassungen an den Expo-Modulen
        run: bash scripts/expo-swift62-fix.sh

      - name: expo prebuild (iOS-Projekt erzeugen)
        run: npx expo prebuild -p ios --no-install

      - name: CocoaPods installieren
        working-directory: ios
        run: pod install --repo-update

      # AD-HOC signiert, nicht unsigniert.
      #
      # Der Simulator braucht kein Zertifikat und kein Profil, aber er
      # braucht die BERECHTIGUNGEN. Ohne sie hat die App keine App-Group,
      # und UserDefaults mit einer Gruppen-Suite liest ins Leere: die Uhr
      # zeigte in Lauf 31931968760 auf allen drei Seiten den Leerzustand,
      # obwohl die Nutzlast nachweislich als Datei danebenlag. Mit
      # CODE_SIGN_IDENTITY=- vergibt Xcode simulierte Berechtigungen, der
      # Gruppen-Container entsteht, und der Schritt danach schreibt dorthin.
      - name: Uhren-App fuer den Simulator bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/Salati.xcworkspace \
            -scheme SalatiWatch \
            -configuration Debug \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Simulator starten und App installieren
        env:
          # Die Eingabe kommt ueber die Umgebung, nicht per ${{ }} mitten in
          # den Skripttext: dort waere sie eine Befehlsinjektion (ein Wert wie
          # '"; rm -rf / #' liefe als Kommando auf dem Runner).
          GERAET: ${{ inputs.geraet }}
        run: |
          set -e
          # Modellnamen wechseln mit jedem Xcode. Erst der Wunsch aus der
          # Eingabe, sonst das erste verfuegbare watchOS-Geraet.
          UDID=$(xcrun simctl list devices available --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).devices;const w=(process.env.GERAET||'').trim();let t=[];for(const v of Object.values(d))for(const g of v)if(w&&g.name===w)t.push(g.udid);if(!t.length)for(const[k,v]of Object.entries(d))if(k.includes('watchOS'))for(const g of v)t.push(g.udid);if(!t.length){console.error('keine watchOS-Simulatoren verfuegbar');process.exit(1)}console.log(t[0])})")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "SalatiWatch.app" -type d | head -1)
          test -n "$APP" || { echo "FEHLER: SalatiWatch.app nicht gebaut"; exit 1; }
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"

      # Die Nutzlast geht per Startargument in die App, nicht ueber die
      # App-Group des Simulators.
      #
      # Drei Anlaeufe sind an cfprefsd gescheitert (Laeufe 31933148169,
      # 31934004643, 31935481831): bei laufendem Geraet haelt er die Suite im
      # Speicher und sieht eine daneben geschriebene Datei nicht; faehrt man das
      # Geraet herunter, schreibt er beim Beenden seinen leeren Stand darueber.
      # Das Startargument umgeht diesen Apparat vollstaendig — dieselbe Loesung
      # wie bei --seite=, und dieselbe wie bei den TV-Ladenbildern.
      #
      # Gegenstueck in targets/salati-watch/WatchPrayerStore.swift
      # (ladeNutzlastAusArgumenten), dort steht auch, was das belegt und was
      # nicht.
      - name: Nutzlast fuer die Pruefung erzeugen
        run: |
          set -e
          NUTZLAST=$(node -e 'const z=(v)=>({Fajr:v[0],Sunrise:v[1],Dhuhr:v[2],Asr:v[3],Maghrib:v[4],Isha:v[5]});process.stdout.write(JSON.stringify({locationLabel:"Berlin, Deutschland",today:z(["03:18","05:42","13:16","17:16","20:39","22:50"]),tomorrow:z(["03:21","05:44","13:16","17:15","20:37","22:47"]),timeFormat:"24h",qiblaBearing:136.7,qiblaDistanceKm:4359,widgetTheme:"auto"}))')
          echo "NUTZLAST=$NUTZLAST" >> "$GITHUB_ENV"
          echo "Nutzlast: ${#NUTZLAST} Zeichen"

      - name: Von jeder Seite ein Bild
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/uhr"
          for SEITE in 1 2 3; do
            xcrun simctl terminate "$UDID" de.salatibox.de.watch || true
            sleep 2
            xcrun simctl launch "$UDID" de.salatibox.de.watch --seite=$SEITE "--nutzlast=$NUTZLAST"
            sleep 8
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/uhr/seite-$SEITE.png"
            echo "Seite $SEITE aufgenommen"
          done
          # Leerzustand: derselbe Start, nur ohne Nutzlast-Argument. Damit ist
          # das Vergleichsbild aus genau demselben Zustand aufgenommen und der
          # Unterschied kann nur an den Daten liegen.
          xcrun simctl terminate "$UDID" de.salatibox.de.watch || true
          sleep 2
          xcrun simctl launch "$UDID" de.salatibox.de.watch
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/uhr/leerzustand.png"
          ls -la "$RUNNER_TEMP/uhr"

      # Ein Leerzustand auf einer Seite mit Daten waere ein stiller
      # Fehlschlag: der Lauf saehe gruen aus und belegte nichts. Seite 1
      # wird deshalb gegen das Leerzustands-Bild geprueft. Sind beide
      # gleich, kamen die Daten nicht an (Lauf 31931968760).
      - name: Nachweis, dass die Uhr echte Zeiten zeigt
        run: |
          set -e
          if cmp -s "$RUNNER_TEMP/uhr/seite-1.png" "$RUNNER_TEMP/uhr/leerzustand.png"; then
            echo "::error::Die Uhr zeigt trotz abgelegter Nutzlast den Leerzustand."
            exit 1
          fi
          echo "Seite 1 unterscheidet sich vom Leerzustand - die Daten sind angekommen."

      - name: Absturzberichte pruefen
        run: |
          BERICHTE=$(find "$HOME/Library/Logs/DiagnosticReports" -name "SalatiWatch*" 2>/dev/null || true)
          if [ -n "$BERICHTE" ]; then
            echo "FEHLER: die Uhren-App ist abgestuerzt"
            for B in $BERICHTE; do echo "--- $B"; head -40 "$B"; done
            exit 1
          fi
          echo "Keine Absturzberichte."

      - name: Bilder nach R2
        if: always()
        env:
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID }}
          CLOUDFLARE_SEC: ${{ secrets.CLOUDFLARE_SEC }}
          CLOUDFLARE_S3_API: ${{ secrets.CLOUDFLARE_S3_API }}
          CLOUDFLARE_BUCKET: ${{ secrets.CLOUDFLARE_BUCKET }}
        run: |
          set -e
          for F in "$RUNNER_TEMP"/uhr/*.png; do
            R2_KEY="pruefung/uhr/$(basename "$F")" node scripts/ci-release-upload.mjs --apk "$F"
          done
