apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Eine Quelle fuer versionName UND die expo-updates-runtimeVersion
 * (Policy 'appVersion' in app.config.ts) - siehe defaultConfig unten.
 * Muss beim Versions-Bump zusammen mit app.config.ts `version` geaendert werden.
 */
def appVersionName = "1.51.0"

/**
 * Sind alle vier Release-Signier-Properties da? (Pfad + 3 Geheimnisse - eine
 * davon zu vergessen ist genauso fatal wie alle vier.)
 */
def RELEASE_SIGNING_PROPS = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
def hasReleaseSigningProps = RELEASE_SIGNING_PROPS.every { project.hasProperty(it) }

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'de.salatibox.de'
    defaultConfig {
        applicationId 'de.salatibox.de'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 76
        versionName appVersionName

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""

        // expo-updates liest die runtimeVersion aus @string/expo_runtime_version
        // (AndroidManifest.xml: expo.modules.updates.EXPO_RUNTIME_VERSION).
        // app.config.ts nutzt die Policy 'appVersion' -> der Wert MUSS identisch
        // mit versionName sein. Hier als resValue generiert statt in
        // res/values/strings.xml gepflegt, damit beide nicht auseinanderlaufen
        // koennen (dieses Projekt baut Android ohne `expo prebuild`, es gibt also
        // keinen Generator, der das automatisch abgleicht).
        resValue "string", "expo_runtime_version", appVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Echter Upload-Keystore, Pfad/Passwoerter kommen als Gradle-Properties
        // von aussen (-PRELEASE_STORE_FILE=... etc., siehe credentials.json,
        // NIE hier im Klartext/committed).
        //
        // KEIN stiller Debug-Fallback mehr: bis 27.07.2026 stand hier
        // `signingConfig ... ? signingConfigs.release : signingConfigs.debug`.
        // Fehlten die Properties, entstand ein mit dem DEBUG-Keystore
        // signiertes AAB, das Play beim Upload abgelehnt hat - ohne dass der
        // Build selbst irgendetwas gemeldet haette. Stattdessen bricht ein
        // Release-Build jetzt hart ab (siehe gradle.taskGraph.whenReady unten).
        release {
            if (hasReleaseSigningProps) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            // proguard-android-optimize.txt statt proguard-android.txt: die
            // Standarddatei enthaelt `-dontoptimize` und verhindert damit einen
            // Grossteil der R8-Optimierungen. Aufgefallen beim AGP-9-Versuch am
            // 30.07.2026 — AGP 9 lehnt die alte Datei aus genau diesem Grund ab.
            // Der Wechsel wirkt aber schon unter AGP 8 und ist deshalb hier
            // geblieben, auch nachdem der AGP-9-Wechsel zurueckgerollt wurde.
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Wearable Data Layer API fuer WearSyncModule (android/app/.../wear/) -
    // Version ungeprueft/nicht gegen einen echten Build verifiziert (siehe
    // Kommentar in WearSyncModule.kt); vor dem ersten echten Android-Build
    // gegen die aktuelle com.google.android.gms:play-services-wearable-Version
    // pruefen. WICHTIG: dieser Block wird von `npx expo prebuild -p android
    // --clean` geloescht (build.gradle ist generiert) - nach jedem Clean-
    // Prebuild manuell wieder ergaenzen.
    implementation("com.google.android.gms:play-services-wearable:19.0.0")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// expo-quick-actions zieht ueber androidx.glance die alte
// androidx.work:work-runtime-ktx:2.7.1 herein, waehrend expo-notifications/
// react-native-android-widget bereits work-runtime:2.8.1 nutzen. Ab
// androidx.work 2.8.0 sind die ktx-Klassen (OneTimeWorkRequestKt,
// PeriodicWorkRequestKt) ins Haupt-Artefakt gewandert - beide zusammen
// erzeugen daher "Duplicate class ..."-Fehler in checkDebugDuplicateClasses.
// Fix: work-runtime-ktx auf 2.8.1 anheben (dort ist es ein leerer Stub ohne
// die duplizierten Klassen). WICHTIG: dieser Block wird von `npx expo
// prebuild -p android --clean` geloescht (build.gradle ist generiert) - nach
// jedem Clean-Prebuild manuell wieder ergaenzen (wie play-services-wearable).
configurations.all {
    resolutionStrategy {
        force "androidx.work:work-runtime-ktx:2.8.1"
    }
}

// Release-Signierung: harter Abbruch statt stiller Debug-Signatur.
//
// Vorgeschichte (2026-07-27): der release-signingConfig fiel bei fehlenden
// RELEASE_*-Properties leise auf signingConfigs.debug zurueck. Ergebnis war ein
// AAB mit Debug-Zertifikat, das erst die Play Console beim Upload abgelehnt hat
// - nach einem kompletten Build. Der Check laeuft in taskGraph.whenReady und
// damit NACH der Konfigurationsphase, aber VOR der ersten Task-Ausfuehrung:
// Debug-Builds (und alles andere) bleiben unveraendert, ein Release-Build
// scheitert in Sekunden statt in Minuten.
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { t ->
        t.project.path == project.path && t.name ==~ /^(assemble|bundle|install|package)Release.*/
    }
    if (releaseTask == null) return

    // Absichtlich NICHT nur die RELEASE_*-Properties pruefen: EAS Build und
    // andere CI-Wege koennen den Keystore auch auf eigenem Weg in
    // signingConfigs.release schreiben. Entscheidend ist allein, ob am Ende ein
    // echter, existierender Keystore drinsteht - und nicht der Debug-Keystore.
    def keystore = android.signingConfigs.findByName('release')?.storeFile
    def debugKeystore = file('debug.keystore')
    def istEchterKeystore = keystore != null &&
        keystore.exists() &&
        keystore.canonicalFile != debugKeystore.canonicalFile
    if (istEchterKeystore) return

    def fehlend = RELEASE_SIGNING_PROPS.findAll { !project.hasProperty(it) }
    def ursache = fehlend.isEmpty()
        ? "RELEASE_STORE_FILE zeigt auf keinen nutzbaren Keystore: ${keystore}"
        : "Fehlende Gradle-Properties: ${fehlend.join(', ')}"
    throw new GradleException(
        "Release-Build ohne Upload-Keystore abgebrochen (Task ${releaseTask.path}).\n" +
        "${ursache}\n" +
        "\n" +
        "Fruehere Versionen dieses Skripts haetten hier still mit dem DEBUG-Keystore\n" +
        "signiert - das Ergebnis lehnt die Play Console beim Upload ab (passiert am 27.07.2026).\n" +
        "\n" +
        "Setze die Werte dauerhaft in ~/.gradle/gradle.properties (NICHT im Repo):\n" +
        "  RELEASE_STORE_FILE=C:/Pfad/zu/upload-keystore.jks\n" +
        "  RELEASE_STORE_PASSWORD=...\n" +
        "  RELEASE_KEY_ALIAS=...\n" +
        "  RELEASE_KEY_PASSWORD=...\n" +
        "oder uebergib sie einmalig per -PRELEASE_STORE_FILE=... usw.\n" +
        "(In CI: ORG_GRADLE_PROJECT_RELEASE_STORE_FILE usw., siehe .github/workflows/android.yml.)\n" +
        "Fuer einen lokalen Testlauf ohne Keystore: assembleDebug statt assembleRelease."
    )
}
